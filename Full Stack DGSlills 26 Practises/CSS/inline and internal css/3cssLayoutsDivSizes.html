<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Layouts Dive Sizes</title>
    <style>
        .box1{
            width: 200px;
            height: 100px;
            background: tomato;
            margin-bottom: 10px;
        }
        .box2{
            width: 50%;
            height: 100px;
            background: skyblue;
            margin-bottom: 10px;
        }
        .hero{
            height: 100vh;
            background: lightgreen;
            text-align: center;
        }

        

        
    </style>
    
</head>
<body>
    <div class="box1">200 PX width</div>
    <div class="box2">50% width</div>
    <div class="hero">100vh height</div>


</body>
</html>
