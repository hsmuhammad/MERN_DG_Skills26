<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Layouts Dive Disply</title>
    <style>
        .box {
            background: orange;
            padding: 10px;
            margin: 5px;
        }
        .block {
            display: block;
        }
        .inline {
            display: inline;
        }
        .inline-block {
            display: inline-block;
            width: 150px;
        }
        .none {
            display: none;
        }
    </style>
    
</head>
<body>
    <div class="box block">Block Element</div>
    <div class="box inline">inline element 1</div>
    <div class="box inline">inline element 2</div>

    <br /><br />

    <div class="box inline-block">inline block 1</div>
    <div class="box inline-block">inline block 2</div>
    <div class="none">you cannot see me</div>



</body>
</html>
