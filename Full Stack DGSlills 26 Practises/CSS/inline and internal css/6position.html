<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        .parent {
            position: relative;
            width: 300px;
            height: 200px;
            background: lightgreen;
        }
        .child {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: red;
            color: white;
        }
        .fxd-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: green;
            color: white;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="parent"> Parent
        <div class="child">Child</div>
    </div>
    <div class="fxd-button">Help</div>
    
</body>
</html>
