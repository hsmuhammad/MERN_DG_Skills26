<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nave Bar</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e3a8a;
            color: white;
            padding: 15px 30px;
        }

        .menu {
            display: flex;
            gap: 20px;
        }
        a {
            color: white;
            text-decoration: none;
        }

    </style>
</head>
<body>
    <div class="navbar">
        <h2>My Web Site</h2>
        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Courses</a>
            <a href="#">Contact</a>
        </div>
    </div>
</body>
</html>
