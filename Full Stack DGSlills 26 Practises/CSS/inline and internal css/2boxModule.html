<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Module</title>
    <style>
        #title{
            color: blue;
        }
        p{
            color: black;
        }
        .red{   
            color: red;
        }
        .box{
            width: 300px;
            padding: 20px;
            border: 2px solid black;
            margin: 20px;
            background: lightblue;
        }
        .hero {
            height: 100vh;
            background: lightgreen;
            width: 50%;
            font-size: 2rem;
            
            
        }
        
        
    </style>
</head>
<body>
    <h1 id="title">CSS Fundamentals</h1>
    <p>this is paragraph one</p>
    <p class="red">this is paragraph two</p>
    <div class="box">Box module demo</div>
    <section class="hero">Full Screen Section</section>
</body>
</html>
