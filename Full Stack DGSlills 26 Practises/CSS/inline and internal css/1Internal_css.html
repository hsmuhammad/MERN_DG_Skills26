<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS</title>
    <style>
        /* Tag selector */
        h1{
            color: blue;
        }
        /* ID selector */
        #red{
            color: brown;
        }
        /* Class selector */
        .header{
            color: aqua;
        }
        /* Root selector */
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
  <h1>Welcom</h1>
  <p id="red">HTML</p>
  <p class="header">CSS</p>

</body>
</html>
