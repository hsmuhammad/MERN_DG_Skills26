<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <header>
        <nav>
        <ul>
            <li><a href="index.html">Form</a></li>
            <li><a href="practice.html">Form practice</a></li>
        </ul>
        
    </nav>
    </header>
    <form>
        <label for="name">Name</label><br />
        <input
        type="text"
        id="name"
        placeholder="Inter Your Name"
        required
        />
        <br /><br />

        <label for="email">Email</label><br />
        <input
        type="email"
        id="email"
        placeholder="Enter Your Email"
        required
        /> <br /><br />

        <label for="password">Password</label><br />
        <input type="password" id="password" minlength="8" required /><br /><br />

        <label>Gender</label><br />
        <input type="radio" name="gender" />Male
        <input type="radio" name="gender" />Female <br /><br />

        <label for="country">Country</label><br />
        <select id="country">
            <option>Pakistan</option>
            <Option>Turki</Option>
            <option>Hijaz</option>
        </select> <br /><br />


        <label for="address">Address</label><br />
        <textarea id="address" rows="4" cols="30"></textarea> <br /><br />

        <label for="photo">Profile Picture</label><br />
        <input type="file" id="photo" /><br /><br />
        <input type="checkbox" required /> I accept the terms & Condition
        <br /><br />
        <input type="submit" value="Register" />
                
    </form>

    


</body>
</html>
